function personDocRef(uid){ return db.collection('people').doc(uid); }

/* ---------- roster (which readers this device can see) ---------- */
const ROSTER_KEY = 'shelfmark-roster';
function loadRoster(){
  try{
    const raw = localStorage.getItem(ROSTER_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function saveRoster(list){
  try{ localStorage.setItem(ROSTER_KEY, JSON.stringify(list)); }catch(e){}
}
function rosterNameFor(uid){
  const r = store.roster.find(x=>x.uid===uid);
  return r ? r.name : 'Reader';
}
function personUid(){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'p-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}
function mergeIncomingAddParam(){
  const params = new URLSearchParams(location.search);
  const addUid = params.get('add');
  const addName = params.get('name');
  if(addUid && addName){
    const r = loadRoster();
    if(!r.some(x=>x.uid===addUid)){
      r.push({ name: addName, uid: addUid });
      saveRoster(r);
    }
    const url = new URL(location.href);
    url.searchParams.delete('add');
    url.searchParams.delete('name');
    history.replaceState({}, '', url.pathname + url.search + url.hash);
  }
}
function shareLinkFor(uid){
  return `${location.origin}${location.pathname}?add=${encodeURIComponent(uid)}&name=${encodeURIComponent(rosterNameFor(uid))}`;
}
function showShareLink(uid){
  const link = shareLinkFor(uid);
  const message = 'Send this link to the other device to add "'+rosterNameFor(uid)+'" there:\n\n'+link;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=> alert('Link copied!\n\n'+message)).catch(()=> prompt(message, link));
  } else {
    prompt(message, link);
  }
}

/* ---------- storage (per-reader, Firestore + localStorage mirror) ---------- */
/* Readers loaded from a dev fixture (see loadDevFixture below) are flagged
   here so saveData/attachListener never touch Firestore for them, even
   across reloads within the same dev session. */
const DEV_NOSYNC_KEY = 'shelfmark-dev-nosync';
function isDevNoSync(uid){
  try{ return JSON.parse(localStorage.getItem(DEV_NOSYNC_KEY) || '[]').includes(uid); }catch(e){ return false; }
}
function markDevNoSync(uid){
  try{
    const list = new Set(JSON.parse(localStorage.getItem(DEV_NOSYNC_KEY) || '[]'));
    list.add(uid);
    localStorage.setItem(DEV_NOSYNC_KEY, JSON.stringify([...list]));
  }catch(e){}
}
function loadCachedData(uid){
  try{
    const raw = localStorage.getItem('shelfmark-data-'+uid);
    if(!raw) return { books: [], rewardLabels: {}, rewardInterval: 100 };
    const parsed = JSON.parse(raw);
    parsed.books = parsed.books || [];
    parsed.rewardLabels = normalizeRewardLabels(parsed.rewardLabels || {});
    parsed.rewardInterval = parsed.rewardInterval || 100;
    return parsed;
  }catch(e){ return { books: [], rewardLabels: {}, rewardInterval: 100 }; }
}
async function saveData(){
  if(!store.currentUid) return;
  store.peopleCache[store.currentUid] = store.data;
  try{ localStorage.setItem('shelfmark-data-'+store.currentUid, JSON.stringify(store.data)); }catch(e){}
  if(!firebaseReady || isDevNoSync(store.currentUid)) return;
  try{
    await personDocRef(store.currentUid).set({
      name: rosterNameFor(store.currentUid),
      books: store.data.books,
      rewardLabels: store.data.rewardLabels,
      rewardInterval: rewardInterval(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    if(store.syncError){ store.syncError = null; render(); }
  }catch(e){
    console.error('Save failed:', e);
    store.syncError = 'Sync failed — changes saved on this device only.';
    render();
  }
}
function attachListener(uid){
  if(!firebaseReady || store.listeners[uid] || isDevNoSync(uid)) return;
  store.listeners[uid] = personDocRef(uid).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return; // echo of our own optimistic write
    const remote = snap.data();
    if(!remote) return;
    const fresh = { books: remote.books || [], rewardLabels: normalizeRewardLabels(remote.rewardLabels || {}), rewardInterval: remote.rewardInterval || 100 };
    store.peopleCache[uid] = fresh;
    try{ localStorage.setItem('shelfmark-data-'+uid, JSON.stringify(fresh)); }catch(e){}
    if(uid === store.currentUid) store.data = fresh;
    render();
  }, err=> console.error('Snapshot error for', uid, err));
}
function personTotalPages(uid){
  const pd = store.peopleCache[uid];
  if(!pd) return 0;
  return (pd.books||[]).reduce((sum,b)=>sum+bookEffectivePages(b),0);
}
function selectPerson(uid){
  store.currentUid = uid;
  if(!store.peopleCache[uid]) store.peopleCache[uid] = loadCachedData(uid);
  store.data = store.peopleCache[uid];
  store.view = { screen:'home', bookId:null };
}
async function createReader(name){
  const newUid = personUid();
  store.peopleCache[newUid] = { books: [], rewardLabels: {}, rewardInterval: 100 };
  store.roster.push({ name, uid: newUid });
  saveRoster(store.roster);
  attachListener(newUid);
  if(firebaseReady){
    try{
      await personDocRef(newUid).set({ name, books: [], rewardLabels: {}, rewardInterval: 100, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }catch(e){
      console.error('Create reader failed:', e);
      store.syncError = 'Sync failed — new reader saved on this device only.';
    }
  }
  return newUid;
}
async function ensureInitialReader(){
  if(store.roster.length > 0) return;
  let name = '';
  while(!name){
    name = (prompt('Welcome to Shelfmark! Whose reading shelf is this?') || '').trim();
  }
  await createReader(name);
}

/* Dev-only data loading: open with ?dev=<fixture> (e.g. ?dev=huge-total) to
   jump straight into a reader preloaded from dev-fixtures/<fixture>.json,
   skipping manual data entry and the roster/welcome prompts. Re-opening the
   same fixture always resets that reader back to the fixture's file contents.
   Restricted to localhost/127.0.0.1 so it can never fire on the deployed site,
   and the reader is Firestore-disabled so test data never syncs to real data. */
async function loadDevFixture(){
  if(!isLocalDev) return false;
  const fixture = new URLSearchParams(location.search).get('dev');
  if(!fixture) return false;

  let payload;
  try{
    const res = await fetch(`./dev-fixtures/${fixture}.json`);
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    payload = await res.json();
  }catch(e){
    console.error(`Dev fixture "${fixture}" failed to load:`, e);
    return false;
  }

  const uid = 'dev-'+fixture;
  const fixtureData = {
    books: payload.books || [],
    rewardLabels: normalizeRewardLabels(payload.rewardLabels || {}),
    rewardInterval: payload.rewardInterval || 100,
  };
  if(!store.roster.some(r=>r.uid===uid)){
    store.roster.push({ name: `Dev: ${fixture}`, uid });
    saveRoster(store.roster);
  }
  markDevNoSync(uid);
  store.peopleCache[uid] = fixtureData;
  try{ localStorage.setItem('shelfmark-data-'+uid, JSON.stringify(fixtureData)); }catch(e){}
  store.currentUid = uid;
  store.data = fixtureData;
  store.view = { screen:'home', bookId:null };
  return true;
}

const store = {
  roster: [],
  peopleCache: {},
  listeners: {},
  currentUid: null,
  data: { books: [], rewardLabels: {}, rewardInterval: 100 },
  view: { screen:'home', bookId:null },
  syncError: null,
};
let showArchived = false;
let showAllRewards = false;

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=10000){
    const k = Math.round(n/1000);
    // Rounding up to 1000k means we've crossed into millions territory.
    if(k>=1000) return (n/1000000).toFixed(1)+'M';
    return k+'k';
  }
  return String(n);
}
function rewardInterval(){
  const n = parseInt(store.data.rewardInterval, 10);
  return (!n || n < 10) ? 100 : n;
}
function bookAutoCompleted(book){
  return !!book.targetPages && bookPagesRead(book) >= book.targetPages;
}
function bookIsCompleted(book){
  return bookAutoCompleted(book) || !!book.completed;
}
function sortedEntries(book){
  return [...book.entries].sort((a,b)=> a.date.localeCompare(b.date));
}
/* Migrates the old dual-key rewardLabels shape ({ [milestone]: label,
   [milestone+'_done']: bool }) to the nested { [milestone]: { label, done } }
   shape. Safe to run on already-migrated data (a no-op pass-through). */
function normalizeRewardLabels(raw){
  const out = {};
  Object.keys(raw).forEach(key=>{
    if(key.endsWith('_done')){
      const milestone = key.slice(0, -'_done'.length);
      out[milestone] = out[milestone] || { label:'', done:false };
      out[milestone].done = !!raw[key];
    } else {
      const val = raw[key];
      if(val && typeof val === 'object'){
        out[key] = { label: val.label || '', done: !!val.done };
      } else {
        out[key] = out[key] || { label:'', done:false };
        out[key].label = val || '';
      }
    }
  });
  return out;
}
function getOrCreateReward(milestone){
  if(!store.data.rewardLabels[milestone]) store.data.rewardLabels[milestone] = { label:'', done:false };
  return store.data.rewardLabels[milestone];
}
/* Returns the lowest not-yet-claimed reward milestone that `after` reaches
   but `before` hadn't, or null if the save didn't cross one. */
function newlyCrossedMilestone(before, after){
  const interval = rewardInterval();
  const firstIdx = Math.floor(before/interval) + 1;
  const lastIdx = Math.floor(after/interval);
  for(let i=firstIdx; i<=lastIdx; i++){
    const milestone = i*interval;
    const reward = store.data.rewardLabels[milestone];
    if(!reward || !reward.done) return milestone;
  }
  return null;
}
function openMilestoneCelebration(milestone){
  const reward = getOrCreateReward(milestone);
  const rewardText = reward.label ? escapeHtml(reward.label) : 'your reward';
  openSheet(`
    <h2>🎉 ${milestone} pages!</h2>
    <div style="font-family:'Inter',sans-serif; font-size:14px; color:var(--ink-soft); margin-bottom:16px;">
      You've crossed the ${milestone}-page milestone — time for ${rewardText}.
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="f-celebrate-later">Not yet — remind me later</button>
      <button class="btn btn-primary" id="f-celebrate-claim">I've claimed it</button>
    </div>
  `, (root)=>{
    root.querySelector('#f-celebrate-later').addEventListener('click', closeSheet);
    root.querySelector('#f-celebrate-claim').addEventListener('click', ()=>{
      reward.done = true;
      saveData(); closeSheet(); render();
    });
  });
}

/* ---------- rendering ---------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(store.view.screen==='roster') app.appendChild(renderRoster());
  else if(store.view.screen==='home') app.appendChild(renderHome());
  else if(store.view.screen==='book') app.appendChild(renderBook(store.view.bookId));
  document.getElementById('fab').style.display = store.view.screen==='home' ? 'flex' : 'none';
}

function syncErrorBanner(){
  if(!store.syncError) return null;
  const syncTag = document.createElement('div');
  syncTag.className = 'sync-error-tag';
  syncTag.setAttribute('role', 'status');
  syncTag.setAttribute('aria-live', 'polite');
  syncTag.textContent = `⚠ ${store.syncError}`;
  return syncTag;
}

function renderRoster(){
  const wrap = document.createElement('div');

  const header = document.createElement('header');
  header.className = 'top';
  header.innerHTML = `<h1>Shelfmark</h1><span class="tag">Reading Tracker</span>`;
  wrap.appendChild(header);

  const versionTag = document.createElement('div');
  versionTag.className = 'version-tag';
  versionTag.textContent = `v${APP_VERSION}`;
  wrap.appendChild(versionTag);

  const syncTag = syncErrorBanner();
  if(syncTag) wrap.appendChild(syncTag);

  wrap.appendChild(sectionTitle('Readers'));
  store.roster.forEach(r=>{
    const el = document.createElement('div');
    el.className = 'card book-card';
    const total = personTotalPages(r.uid);
    el.innerHTML = `
      <div class="book-row">
        <div>
          <div class="book-title">${escapeHtml(r.name)}</div>
          <div class="book-meta">${fmtNum(total)} pages read</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="book-page">${fmtNum(total)}p</div>
          <button class="del-x" data-share="${r.uid}" title="Share link" style="font-size:18px;">🔗</button>
        </div>
      </div>`;
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-share]')) return;
      selectPerson(r.uid); render();
    });
    el.querySelector('[data-share]').addEventListener('click', (e)=>{
      e.stopPropagation();
      showShareLink(r.uid);
    });
    wrap.appendChild(el);
  });

  wrap.appendChild(sectionTitle('Add a reader'));
  wrap.appendChild(addReaderCard());

  return wrap;
}

function addReaderCard(){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div style="font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft); margin-bottom:10px;">
      Add another reader on this device, then share their link to add them elsewhere.
    </div>
    <button class="btn btn-secondary" id="btn-new-reader" style="width:100%;">+ Add reader</button>
  `;
  el.querySelector('#btn-new-reader').addEventListener('click', openAddReaderSheet);
  return el;
}

function openAddReaderSheet(){
  openSheet(`
    <h2>Add a reader</h2>
    <div class="field"><label>Name</label><input id="f-name" type="text" placeholder="e.g. Maya"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Add reader</button>
    </div>
  `, (root)=>{
    root.querySelector('#f-cancel').addEventListener('click', closeSheet);
    root.querySelector('#f-save').addEventListener('click', async ()=>{
      const name = root.querySelector('#f-name').value.trim();
      if(!name) return;
      const newUid = await createReader(name);
      closeSheet();
      store.view = { screen:'roster' };
      render();
      showShareLink(newUid);
    });
    root.querySelector('#f-name').focus();
  });
}

function renderHome(){
  const wrap = document.createElement('div');

  if(store.roster.length > 1){
    const back = document.createElement('button');
    back.className = 'back-link';
    back.textContent = '← Readers';
    back.addEventListener('click', ()=>{ store.view = { screen:'roster' }; render(); });
    wrap.appendChild(back);
  }

  const header = document.createElement('header');
  header.className = 'top';
  header.innerHTML = `<h1>Shelfmark</h1><span class="tag">Reading Tracker</span>`;
  wrap.appendChild(header);

  const versionTag = document.createElement('div');
  versionTag.className = 'version-tag';
  versionTag.textContent = `v${APP_VERSION}`;
  wrap.appendChild(versionTag);

  const syncTag = syncErrorBanner();
  if(syncTag) wrap.appendChild(syncTag);

  const total = totalPagesRead(store.data.books);
  const interval = rewardInterval();
  const nextMilestone = (Math.floor(total/interval)+1)*interval;
  const shelf = document.createElement('div');
  shelf.className = 'shelf';

  const spinesHtml = store.data.books.length ? store.data.books.map(b=>{
    const pages = bookEffectivePages(b);
    const maxPages = Math.max(...store.data.books.map(bookEffectivePages), 1);
    const h = Math.max(14, Math.round((pages/maxPages)*76));
    const hue = colorForBook(b.id);
    const completed = bookIsCompleted(b);
    return `<div class="spine${b.archived?' spine-archived':''}" data-book-id="${b.id}" data-spine-label="${escapeHtml(b.title)}${completed?' (completed)':''}${b.archived?' (archived)':''}" style="height:${h}px; background:${hue};" title="${escapeHtml(b.title)}${completed?' (completed)':''}${b.archived?' (archived)':''}">
      ${completed ? '<div class="spine-check">✓</div>' : ''}
    </div>`;
  }).join('') : `<div style="flex:1; text-align:center; font-family:Inter,sans-serif; font-size:12px; color:var(--ink-soft); align-self:center;">No books yet</div>`;

  shelf.innerHTML = `
    <div class="shelf-total">
      <div>
        <div class="num">${fmtNum(total)}</div>
        <div class="label">Total pages read</div>
      </div>
      <div class="next">${fmtNum(interval - (total%interval))} pages to<br>next reward (${fmtNum(nextMilestone)})</div>
    </div>
    <div class="spines">${spinesHtml}</div>
  `;
  wrap.appendChild(shelf);

  shelf.querySelectorAll('.spine[data-book-id]').forEach(spine=>{
    spine.addEventListener('click', (e)=>{
      e.stopPropagation();
      const existing = spine.querySelector('.spine-label');
      shelf.querySelectorAll('.spine-label').forEach(l=>l.remove());
      if(existing) return;
      const label = document.createElement('div');
      label.className = 'spine-label';
      label.textContent = spine.getAttribute('data-spine-label');
      spine.appendChild(label);
      setTimeout(()=>label.remove(), 2500);
    });
  });

  const archivedCount = store.data.books.filter(b=>b.archived).length;
  const booksHeader = document.createElement('div');
  booksHeader.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin:22px 4px 8px;';
  booksHeader.innerHTML = `
    <div class="section-title" style="margin:0;">Your books</div>
    ${archivedCount ? `<button class="archive-toggle">${showArchived?'Hide':'Show'} archived (${archivedCount})</button>` : ''}
  `;
  wrap.appendChild(booksHeader);
  const toggleBtn = booksHeader.querySelector('.archive-toggle');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{ showArchived = !showArchived; render(); });
  }

  const visibleBooks = store.data.books.filter(b=>showArchived || !b.archived);
  if(visibleBooks.length===0){
    const e = document.createElement('div');
    e.className='card empty';
    e.textContent = store.data.books.length===0 ? 'Tap + to add your first book.' : 'No books to show.';
    wrap.appendChild(e);
  } else {
    visibleBooks.slice().sort((a,b)=>{
      if(!!a.archived !== !!b.archived) return a.archived ? 1 : -1;
      const ca = bookIsCompleted(a), cb = bookIsCompleted(b);
      if(ca !== cb) return ca ? 1 : -1;
      return b.updatedAt-a.updatedAt;
    }).forEach(b=>{
      wrap.appendChild(bookCard(b));
    });
  }

  wrap.appendChild(rewardsCard(total));

  wrap.appendChild(sectionTitle('Options'));
  wrap.appendChild(optionsCard());

  return wrap;
}

function exportData(){
  const payload = JSON.stringify({ ...store.data, exportedFromVersion: APP_VERSION }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = `shelfmark-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function isValidBookEntry(e){
  return !!e && typeof e === 'object' && typeof e.date === 'string' && Number.isFinite(e.page) && e.page >= 0;
}
function isValidBook(b){
  if(!b || typeof b !== 'object') return false;
  if(typeof b.id !== 'string' || !b.id) return false;
  if(typeof b.title !== 'string' || !b.title.trim()) return false;
  if(!Array.isArray(b.entries) || !b.entries.every(isValidBookEntry)) return false;
  if(b.targetPages != null && (!Number.isFinite(b.targetPages) || b.targetPages < 0)) return false;
  if(b.multiplier != null && (!Number.isFinite(b.multiplier) || b.multiplier < 0)) return false;
  return true;
}
function isValidRewardLabels(r){
  return !!r && typeof r === 'object' && !Array.isArray(r);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('That file isn\'t valid Shelfmark data (couldn\'t read it as JSON).'); return; }
    if(!parsed || !Array.isArray(parsed.books) || !parsed.books.every(isValidBook) || (parsed.rewardLabels != null && !isValidRewardLabels(parsed.rewardLabels))){
      alert('That file isn\'t valid Shelfmark data.'); return;
    }
    const proceed = confirm('Import will replace all current books, history, and rewards with the contents of this file. Continue?');
    if(!proceed) return;
    store.data = { books: parsed.books, rewardLabels: normalizeRewardLabels(isValidRewardLabels(parsed.rewardLabels) ? parsed.rewardLabels : {}), rewardInterval: parsed.rewardInterval || 100 };
    saveData();
    store.view = {screen:'home'};
    render();
    alert('Import complete.');
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}

function colorForBook(id){
  const palette = ['#2F4B3C','#6B4A3A','#3C4A6B','#7A5C2E','#4A3C6B','#2E6B5C'];
  let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0))>>>0;
  return palette[h % palette.length];
}

function rewardsCard(total){
  const el = document.createElement('div');
  el.className='card';
  el.style.marginTop='22px';
  const interval = rewardInterval();
  const lastReachedIndex = Math.floor(total/interval);

  // Rendering is capped so a mistakenly huge "current page" entry (which can
  // push lastReachedIndex into the millions) can never flood the DOM with one
  // row per milestone.
  const MAX_ROWS = 200;
  const SCAN_CAP = 5000; // far beyond any realistic number of manually-claimed rewards

  let earliestUnchecked = lastReachedIndex+1;
  for(let i=1;i<=Math.min(lastReachedIndex, SCAN_CAP);i++){
    if(!(store.data.rewardLabels[i*interval] && store.data.rewardLabels[i*interval].done)){ earliestUnchecked = i; break; }
  }

  // Milestones from earliestUnchecked through lastReachedIndex have been
  // reached but not claimed yet — this is normally just the current one, but
  // can stack up if the total jumps ahead by more than one interval without
  // claiming in between.
  const unclaimedLast = Math.max(earliestUnchecked, lastReachedIndex);
  const milestoneCount = unclaimedLast + 3; // always show a few upcoming locked rewards

  let rowIndices, hiddenCount, gapAfterPos, gapCount;
  if(showAllRewards){
    const contiguousStart = Math.max(1, milestoneCount - MAX_ROWS + 1);
    const pinEarliest = earliestUnchecked < contiguousStart;
    rowIndices = pinEarliest ? [earliestUnchecked] : [];
    for(let i=contiguousStart;i<=milestoneCount;i++) rowIndices.push(i);
    hiddenCount = pinEarliest ? earliestUnchecked-1 : contiguousStart-1;
    gapAfterPos = 0;
    gapCount = pinEarliest ? contiguousStart - earliestUnchecked - 1 : 0;
  } else {
    // Collapsed view: the current unclaimed reward, up to three more
    // unclaimed rewards behind it, the rest of the unclaimed backlog
    // collapsed behind a count, then the upcoming locked rewards.
    const SHOWN_UNCLAIMED = 4; // current + up to three more
    const shownUnclaimedEnd = Math.min(unclaimedLast, earliestUnchecked + SHOWN_UNCLAIMED - 1);
    rowIndices = [];
    for(let i=earliestUnchecked;i<=shownUnclaimedEnd;i++) rowIndices.push(i);
    const hiddenUnclaimedCount = unclaimedLast - shownUnclaimedEnd;
    gapAfterPos = rowIndices.length - 1;
    gapCount = hiddenUnclaimedCount;
    for(let i=unclaimedLast+1;i<=milestoneCount;i++) rowIndices.push(i);
    hiddenCount = (earliestUnchecked-1) + hiddenUnclaimedCount;
  }

  const showToggle = hiddenCount > 0 || showAllRewards;
  const headerHtml = `
    <div class="rewards-header">
      <h3 class="rewards-title">Rewards</h3>
      ${showToggle ? `<button class="reward-pill ${showAllRewards?'on':''}">
        <span class="dot"></span>${showAllRewards ? 'Show recent only' : `Show all (${hiddenCount} earlier hidden)`}
      </button>` : ''}
    </div>`;

  // Determine per-row state, in ascending order, over the rendered window.
  // "Active" is the single earliest rendered row that is not yet claimed;
  // every rendered row after it is Locked, regardless of whether total already covers it.
  let activeIdx = null;
  for(const i of rowIndices){
    const milestone = i*interval;
    if(!(store.data.rewardLabels[milestone] && store.data.rewardLabels[milestone].done)){ activeIdx = i; break; }
  }

  let rows = '';
  rowIndices.forEach((i, pos)=>{
    const milestone = i*interval;
    const reached = total >= milestone;
    const done = !!(store.data.rewardLabels[milestone] && store.data.rewardLabels[milestone].done);
    const label = (store.data.rewardLabels[milestone] && store.data.rewardLabels[milestone].label) || '';
    let state;
    if(done) state = 'claimed';
    else if(activeIdx !== null && i === activeIdx) state = reached ? 'active-ready' : 'active-pending';
    else state = 'locked';

    let badgeHtml, milestoneClass = '', rowClass = '';
    if(state === 'claimed'){
      badgeHtml = `<button class="reward-badge claimed" data-milestone="${milestone}" aria-label="Completed: ${milestone} pages">✓</button>`;
    } else if(state === 'active-ready'){
      badgeHtml = `<button class="reward-badge active-ready" data-milestone="${milestone}" aria-label="Reward ready to claim: ${milestone} pages">★</button>`;
      rowClass = 'active reward-tinted'; milestoneClass = 'active';
    } else if(state === 'active-pending'){
      badgeHtml = `<button class="reward-badge active-pending" data-milestone="${milestone}" disabled aria-label="Next goal: ${milestone} pages">●</button>`;
      rowClass = 'active'; milestoneClass = 'active';
    } else {
      badgeHtml = `<button class="reward-badge locked" data-milestone="${milestone}" disabled aria-label="Locked: ${milestone} pages"></button>`;
      rowClass = 'reward-locked';
    }

    const isLast = pos === rowIndices.length-1;
    const lineHtml = isLast ? '' : `<div class="reward-line ${state==='claimed'?'filled':''}"></div>`;

    let valueHtml;
    if(state === 'claimed' || state === 'active-ready'){
      valueHtml = `
        <div class="reward-value-row">
          <span class="reward-value-text ${label?'':'is-empty'}">${label?escapeHtml(label):'No reward set'}</span>
        </div>`;
    } else {
      valueHtml = `
        <div class="reward-value-row">
          <input type="text" class="reward-input" placeholder="Name your reward…" value="${escapeHtml(label)}" data-label="${milestone}">
        </div>`;
    }

    rows += `
      <div class="reward-row ${rowClass}">
        <div class="reward-node">
          ${badgeHtml}
          ${lineHtml}
        </div>
        <div class="reward-body">
          <div class="reward-milestone ${milestoneClass}">${fmtNum(milestone)} pages</div>
          ${valueHtml}
        </div>
      </div>`;

    if(pos === gapAfterPos && gapCount > 0){
      rows += `
        <div class="reward-row reward-gap-row">
          <div class="reward-node"><div class="reward-line"></div></div>
          <div class="reward-body">
            <div class="reward-gap-text">${gapCount} more unclaimed reward${gapCount===1?'':'s'} waiting</div>
          </div>
        </div>`;
    }
  });
  el.innerHTML = headerHtml + rows;

  const pillBtn = el.querySelector('.reward-pill');
  if(pillBtn){
    pillBtn.addEventListener('click', ()=>{ showAllRewards = !showAllRewards; render(); });
  }

  el.querySelectorAll('.reward-badge[data-milestone]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      const m = btn.getAttribute('data-milestone');
      const entry = getOrCreateReward(m);
      entry.done = !entry.done;
      saveData(); render();
    });
  });

  el.querySelectorAll('input[data-label]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const m = inp.getAttribute('data-label');
      getOrCreateReward(m).label = inp.value;
      saveData();
    });
  });

  return el;
}

function renderBook(bookId){
  const b = store.data.books.find(x=>x.id===bookId);
  const wrap = document.createElement('div');
  if(!b){ store.view={screen:'home'}; return renderHome(); }

  const auto = bookAutoCompleted(b);
  const completed = bookIsCompleted(b);

  const header = document.createElement('header');
  header.className='top';
  header.innerHTML = `<h1 style="font-size:22px;">${completed?'<span class="completed-check" title="Completed">✓</span> ':''}${escapeHtml(b.title)}</h1>${b.archived?'<span class="tag-pill">Archived</span>':''}`;
  wrap.appendChild(header);

  const syncTag = syncErrorBanner();
  if(syncTag) wrap.appendChild(syncTag);

  const pages = bookPagesRead(b);
  const mult = bookMultiplier(b);
  const effective = bookEffectivePages(b);
  const summary = document.createElement('div');
  summary.className='shelf';
  const target = b.targetPages;
  const pct = target ? Math.min(100, Math.round((pages/target)*100)) : null;
  summary.innerHTML = `
    <div class="shelf-total">
      <div>
        <div class="num">${fmtNum(pages)}</div>
        <div class="label">Pages read${target?` of ${fmtNum(target)}`:''}</div>
      </div>
      ${mult>1 ? `<div class="next">${mult}× bonus<br>= ${fmtNum(effective)}p counted</div>` : ''}
    </div>
    ${target ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
  `;
  wrap.appendChild(summary);

  const addBtn = document.createElement('button');
  addBtn.className='btn btn-accent';
  addBtn.style.width='100%'; addBtn.style.marginBottom='10px';
  addBtn.textContent='Log progress';
  addBtn.addEventListener('click', ()=> openEntrySheet(b.id));
  wrap.appendChild(addBtn);

  const navRow = document.createElement('div');
  navRow.className='btn-row';
  navRow.style.marginBottom='14px';

  const backBtn = document.createElement('button');
  backBtn.className='btn btn-secondary';
  backBtn.textContent='← Books';
  backBtn.addEventListener('click', ()=>{ store.view={screen:'home'}; render(); });
  navRow.appendChild(backBtn);

  const editBtn = document.createElement('button');
  editBtn.className='btn btn-secondary';
  editBtn.textContent='Edit details';
  editBtn.addEventListener('click', ()=> openBookEditSheet(b.id));
  navRow.appendChild(editBtn);

  wrap.appendChild(navRow);

  const statusRow = document.createElement('div');
  statusRow.className='btn-row';
  statusRow.style.marginBottom='14px';

  if(!auto){
    const finishBtn = document.createElement('button');
    finishBtn.className='btn btn-secondary';
    finishBtn.textContent = b.completed ? 'Mark as unfinished' : 'Mark as finished';
    finishBtn.addEventListener('click', ()=>{
      b.completed = !b.completed; b.updatedAt = Date.now();
      saveData(); render();
    });
    statusRow.appendChild(finishBtn);
  }

  const archiveBtn = document.createElement('button');
  archiveBtn.className='btn btn-secondary';
  archiveBtn.textContent = b.archived ? 'Unarchive' : 'Archive';
  archiveBtn.addEventListener('click', ()=>{
    b.archived = !b.archived; b.updatedAt = Date.now();
    saveData(); render();
  });
  statusRow.appendChild(archiveBtn);

  wrap.appendChild(statusRow);

  wrap.appendChild(sectionTitle('History'));
  const histCard = document.createElement('div');
  histCard.className='card';
  const entries = sortedEntries(b).reverse();
  if(entries.length===0){
    histCard.innerHTML = `<div class="empty" style="padding:8px 0;">No entries yet.</div>`;
  } else {
    histCard.innerHTML = entries.map(e=>`
      <div class="history-row">
        <span>${fmtDate(e.date)}</span>
        <span><span class="hp">p.${e.page}</span> <button class="del-x" data-date="${e.date}">✕</button></span>
      </div>`).join('');
  }
  wrap.appendChild(histCard);
  histCard.querySelectorAll('.del-x').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const dt = btn.getAttribute('data-date');
      b.entries = b.entries.filter(e=>e.date!==dt);
      saveData(); render();
    });
  });

  return wrap;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openEntrySheet(bookId){
  const b = store.data.books.find(x=>x.id===bookId);
  // Use >= (not >) so that when multiple entries share the same date, the
  // most recently *added* one (later in the array) wins the tie, rather than
  // whichever happened to be encountered first by reduce.
  const lastEntry = b.entries.length ? b.entries.reduce((a,e)=> e.date>=a.date?e:a) : null;
  openSheet(`
    <h2>Log progress — ${escapeHtml(b.title)}</h2>
    ${lastEntry ? `<div class="last-entry-hint">Last logged: p.${lastEntry.page} · ${fmtDate(lastEntry.date)}</div>` : ''}
    <div class="field"><label>Date</label><input id="f-date" type="date" value="${todayStr()}"></div>
    <div class="field">
      <label>Page you're on</label>
      <div class="stepper-row">
        <button type="button" class="stepper-btn" data-step="-10">−10</button>
        <button type="button" class="stepper-btn" data-step="-1">−1</button>
        <input id="f-page" class="stepper-input" type="number" inputmode="numeric" placeholder="e.g. 145">
        <button type="button" class="stepper-btn" data-step="1">+1</button>
        <button type="button" class="stepper-btn" data-step="10">+10</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Save entry</button>
    </div>
  `, (root)=>{
    root.querySelector('#f-cancel').addEventListener('click', closeSheet);
    const pageInput = root.querySelector('#f-page');
    root.querySelectorAll('.stepper-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const step = parseInt(btn.getAttribute('data-step'), 10);
        const current = parseInt(pageInput.value, 10) || 0;
        pageInput.value = Math.max(0, current + step);
      });
    });
    root.querySelector('#f-save').addEventListener('click', ()=>{
      const date = root.querySelector('#f-date').value || todayStr();
      const page = parseInt(pageInput.value, 10);
      if(isNaN(page) || page < 0) return;
      const beforeTotal = totalPagesRead(store.data.books);
      b.entries = b.entries.filter(e=>e.date!==date);
      b.entries.push({date, page});
      b.updatedAt = Date.now();
      saveData(); closeSheet(); render();
      const afterTotal = totalPagesRead(store.data.books);
      const crossedMilestone = newlyCrossedMilestone(beforeTotal, afterTotal);
      if(crossedMilestone) openMilestoneCelebration(crossedMilestone);
    });
    pageInput.focus();
  });
}

async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:60px 20px; text-align:center; font-family:'Inter',sans-serif; color:var(--page-warm); opacity:0.8;">Loading your shelf…</div>`;
  mergeIncomingAddParam();
  store.roster = loadRoster();
  const devLoaded = await loadDevFixture();
  if(!devLoaded) await ensureInitialReader();
  store.roster.forEach(r=>{
    if(!store.peopleCache[r.uid]) store.peopleCache[r.uid] = loadCachedData(r.uid);
    attachListener(r.uid);
  });
  if(!devLoaded){
    if(store.roster.length <= 1){
      selectPerson(store.roster[0].uid);
    } else {
      store.view = { screen:'roster' };
    }
  }
  render();
}
init();

/* ---------- PWA install support ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(err=> console.warn('Service worker registration failed:', err));
}
</script>
